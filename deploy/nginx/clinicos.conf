# ClinicOS Production Nginx Configuration (VPS / HTTPS)
# Place in /etc/nginx/sites-available/clinicos.conf and symlink to sites-enabled.

limit_req_zone $binary_remote_addr zone=clinicos_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=clinicos_api:10m rate=60r/m;

server {
    listen 80;
    listen [::]:80;
    server_name clinic.example.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name clinic.example.com;

    server_tokens off;

    # TLS certificates (managed via Certbot / Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/clinic.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/clinic.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    root /var/www/clinicos/dist;
    index index.html;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; img-src 'self' data: https://*.googleusercontent.com; font-src 'self' data:; connect-src 'self' https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Block dotfiles and source maps if ever accidentally deployed
    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }

    location ~* \.map$ {
        deny all;
        return 404;
    }

    # Strict rate limit on authentication endpoints
    location ~ ^/api/v1/auth/(login|register|google)$ {
        limit_req zone=clinicos_auth burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # General API reverse proxy
    location /api/ {
        limit_req zone=clinicos_api burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
