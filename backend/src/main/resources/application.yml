spring:
  application:
    name: clinic-management-backend
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    clean-disabled: true
  sql:
    init:
      mode: never
  mvc:
    problemdetails:
      enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true

clinic:
  security:
    jwt:
      secret-base64: ${JWT_SECRET:}
      issuer: ${JWT_ISSUER:clinic-management}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:}
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
    rate-limit:
      enabled: ${RATE_LIMIT_ENABLED:true}
      login-max-requests: ${RATE_LIMIT_LOGIN_MAX:10}
      register-max-requests: ${RATE_LIMIT_REGISTER_MAX:5}
      window-seconds: ${RATE_LIMIT_WINDOW_SECONDS:60}

logging:
  level:
    org.hibernate.orm.jdbc.bind: OFF
    # Database error messages can include row values. API errors are sanitized separately.
    org.hibernate.orm.jdbc.error: OFF
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: OFF
    org.springframework.security: INFO
    org.springframework.web: INFO

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false
