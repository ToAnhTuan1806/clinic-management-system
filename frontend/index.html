<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%231e5ed2'/%3E%3Ctext x='20' y='28' text-anchor='middle' font-family='sans-serif' font-size='26' font-weight='bold' fill='white'%3EC%3C/text%3E%3C/svg%3E"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="ClinicOS — Nền tảng giao diện quản lý phòng khám. Bản DEMO chưa tích hợp API."
    />
    <title>ClinicOS DEMO</title>
    <script>
      try {
        const theme = localStorage.getItem('clinic-theme')
        const dark =
          theme === 'dark' ||
          (theme !== 'light' &&
            matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
      } catch {
        document.documentElement.classList.toggle(
          'dark',
          matchMedia('(prefers-color-scheme: dark)').matches,
        )
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
